<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1931">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>입고톡</title>
<style>
:root{--navy:#0A1931;--navy2:#1B3A6B;--red:#E4002B;--bg:#F4F6F9;--card:#fff;--line:#DDE3EA;--text:#1B2733;--sub:#5A6B7B;--ok:#1F7A4D;--warn:#C2410C;--danger:#C0392B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Pretendard,"Malgun Gothic",-apple-system,Roboto,sans-serif;font-size:15px}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:10px 14px 8px;padding-top:calc(10px + env(safe-area-inset-top))}
header .row{display:flex;align-items:center;justify-content:space-between}
header .ttl{font-weight:700;font-size:18px}
header .dt{font-size:13px;opacity:.85}
.pcst{font-size:12px;margin-top:4px;opacity:.95}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
main{padding:12px 12px 90px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:13px;color:var(--sub)}
nav.tabs button b{display:block;font-size:15px;margin-bottom:2px}
nav.tabs button.on{color:var(--navy);font-weight:700;box-shadow:inset 0 3px 0 var(--red)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.kpi{cursor:pointer}
.kpi .l{font-size:12px;color:var(--sub)}
.kpi .n{font-size:24px;font-weight:700;margin-top:2px}
.kpi.bad .n{color:var(--danger)}
.kpi.wide{grid-column:1/3}
h3{font-size:14px;margin:16px 2px 8px;color:var(--navy)}
.list{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.it{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it .bd{flex:1;min-width:0}
.it .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .t2{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.bdg{font-size:12px;font-weight:700;padding:3px 7px;border-radius:5px;white-space:nowrap;background:#EEF2F7;color:var(--navy2)}
.bdg.o{background:#FDECEA;color:var(--danger)}
.bdg.t{background:#FFF4E5;color:var(--warn)}
.bdg.d{background:#E7F4EC;color:var(--ok)}
.bdg.p{background:#FFF4E5;color:var(--warn);font-weight:600}
.chk{width:24px;height:24px;flex:none;accent-color:var(--navy2)}
.seg{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.seg button{flex:1;min-width:70px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 4px;font-size:13px}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.inp{width:100%;border:1px solid var(--line);border-radius:7px;padding:10px 12px;font:inherit;background:#fff}
.btn{border:0;border-radius:7px;padding:11px 14px;font-weight:700;background:var(--navy);color:#fff}
.btn.red{background:var(--red)}
.btn.gray{background:#EEF2F7;color:var(--text)}
.btn.full{width:100%}
.actbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:7;padding:8px 12px;background:rgba(244,246,249,.97);border-top:1px solid var(--line);display:flex;gap:8px}
.actbar .btn{flex:1}
.empty{padding:22px;text-align:center;color:var(--sub);font-size:14px}
.note{font-size:12px;color:var(--sub);margin:8px 2px;line-height:1.5}
.cal{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.calh button{border:0;background:#EEF2F7;border-radius:6px;padding:6px 12px}
.calh b{font-size:16px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wk{font-size:12px;text-align:center;color:var(--sub);padding:4px 0}
.dc{min-height:46px;border-radius:6px;padding:4px 2px;text-align:center;font-size:14px;cursor:pointer;border:1px solid transparent}
.dc.out{opacity:.35}
.dc.sun,.dc.hol{color:var(--danger)}
.dc.sat{color:#1565C0}
.dc.td{border-color:var(--red)}
.dc.sel{background:var(--navy);color:#fff}
.dc .cnt{display:block;font-size:10px;margin-top:3px;color:var(--sub)}
.dc.sel .cnt{color:#cfd8e3}
.dc .hn{display:block;font-size:9px;line-height:1.1;white-space:nowrap;overflow:hidden}
.task{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .tx{flex:1;word-break:break-all}
.task.s .tx{text-decoration:line-through;color:#8A96A3}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow .inp{flex:1}
.ven .vn{font-weight:700}
.ven .ct{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:14px}
.ven a{background:var(--ok);color:#fff;text-decoration:none;border-radius:6px;padding:6px 12px;font-weight:700;font-size:13px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,25,49,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:12px 12px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.sheet h2{font-size:17px;margin:0 0 10px}
.kv{display:flex;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.kv .k{width:84px;color:var(--sub);flex:none}
.kv .v{flex:1;word-break:break-all}
.sheet .btns{display:flex;gap:8px;margin-top:14px}
.sheet .btns .btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(27,39,51,.94);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;display:none;max-width:90%;text-align:center}
.login{max-width:420px;margin:40px auto;padding:0 16px}
.login .card{padding:18px}
.login label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
.err{color:var(--danger);font-size:13px;margin-top:10px;white-space:pre-line}
.logout{display:block;margin:22px auto 0;border:0;background:none;color:var(--sub);text-decoration:underline;font-size:13px}
</style>
</head>
<body>
<header id="hdr" hidden>
  <div class="row"><div class="ttl">입고톡</div><div class="dt" id="hdt"></div></div>
  <div class="pcst" id="pcst">불러오는 중...</div>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs" hidden>
  <button data-v="home"><b>홈</b>오늘 요약</button>
  <button data-v="in"><b>입고</b>입고 체크</button>
  <button data-v="work"><b>업무</b>달력</button>
  <button data-v="ven"><b>업체</b>연락처</button>
</nav>
<div id="act"></div>
<div id="sheet"></div>
<div id="toast"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, doc, collection, onSnapshot, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ---------- 설정 (PC 입고톡이 [모바일 앱 파일 만들기] 때 채워 넣습니다) ----------
let CFG = { apiKey: "AIzaSyCDDiUYp7I7qPH9_4q_Y9txDmJXJd5vZ1Y", projectId: "ipgotok" };
if (CFG.apiKey.startsWith("__")) {
  try { CFG = JSON.parse(localStorage.getItem("ipgo_cfg") || "null") || CFG; } catch (e) {}
}
const WK = "일월화수목금토";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => ymd(new Date());
const P = (s) => { const a = String(s).split("-").map(Number); return new Date(a[0], a[1] - 1, a[2]); };
const isD = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s || "");
const dday = (due) => isD(due) ? Math.round((P(due) - P(today())) / 86400000) : null;
const md = (s) => { if (!isD(s)) return s || "-"; const d = P(s); return (d.getMonth() + 1) + "/" + d.getDate() + " (" + WK[d.getDay()] + ")"; };
const md2 = (s) => isD(s) ? (Number(s.slice(5, 7)) + "/" + Number(s.slice(8, 10))) : (s || "-");
const uid4 = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

let toastT = 0;
function toast(t) { const e = $("#toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => (e.style.display = "none"), 2600); }

// ---------- 상태 ----------
const S = { items: [], memos: {}, vendors: [], meta: {}, queue: [], loaded: {}, err: "" };
const V = { tab: "home", inTab: "", q: "", sel: new Set(), cy: 0, cm: 0, day: today(), vq: "" };
let fs = null, auth = null, user = null, unsubs = [];

// ---------- 시작 ----------
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(() => {}); }
if (!CFG.apiKey || CFG.apiKey.startsWith("__")) { setupView(); } else { boot(); }

function boot() {
  const app = initializeApp({ apiKey: CFG.apiKey, authDomain: CFG.projectId + ".firebaseapp.com", projectId: CFG.projectId });
  try { fs = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() }) }); }
  catch (e) { fs = initializeFirestore(app, {}); }
  auth = getAuth(app);
  onAuthStateChanged(auth, (u) => {
    unsubs.forEach((f) => f()); unsubs = [];
    user = u;
    if (!u) { loginView(); return; }
    $("#hdr").hidden = false; $("#tabs").hidden = false;
    listen(); render();
  });
}

function listen() {
  const base = ["users", user.uid];
  for (const k of ["items", "memos", "vendors", "meta"]) {
    unsubs.push(onSnapshot(doc(fs, ...base, "ipgo", k), (d) => {
      if (d.exists()) { try { S[k] = JSON.parse(d.data().j || "null") || S[k]; } catch (e) {} }
      S.loaded[k] = true; S.err = ""; render();
    }, (e) => { S.err = fsErr(e); render(); }));
  }
  unsubs.push(onSnapshot(collection(fs, ...base, "queue"), (snap) => {
    S.queue = snap.docs.map((d) => { let op = {}; try { op = JSON.parse(d.data().j || "{}"); } catch (e) {} return { id: d.id, op }; })
      .sort((a, b) => (a.op.c || 0) - (b.op.c || 0));
    render();
  }, (e) => { S.err = fsErr(e); render(); }));
}

function fsErr(e) {
  const c = (e && e.code) || "";
  if (c.includes("permission")) return "접근 권한이 없습니다. Firestore 접근 규칙을 설명서대로 넣었는지 확인해 주세요.";
  if (c.includes("unavailable")) return "인터넷 연결이 없어 저장된 내용을 보여 줍니다.";
  return "오류 : " + (e && e.message ? e.message : c);
}

// ---------- 요청 보내기 (PC 가 받아서 반영) ----------
function sendOp(op) {
  op.id = uid4(); op.c = Date.now();
  addDoc(collection(fs, "users", user.uid, "queue"), { j: JSON.stringify(op), c: op.c })
    .catch((e) => toast("보내지 못했습니다 : " + fsErr(e)));
}
function cancelOp(qid) { deleteDoc(doc(fs, "users", user.uid, "queue", qid)).catch(() => {}); }

// ---------- 화면에 보여 줄 데이터 (반영 대기 요청을 미리 겹쳐서) ----------
function items() {
  const pend = {};
  for (const q of S.queue) { const o = q.op; if (o.t === "done" || o.t === "undo") pend[o.sid] = q; }
  return (S.items || []).map((r) => {
    const x = Object.assign({}, r); const q = pend[r.id];
    if (q) { x.pq = q; if (q.op.t === "done") { x.st = "입고완료"; x.act = q.op.date; } else { x.st = q.op.prev || "대기"; x.act = ""; } }
    x.D = dday(x.due); return x;
  });
}
const isOpen = (r) => r.st !== "입고완료" && r.st !== "취소";
function groups() {
  const span = Number(S.meta.span != null ? S.meta.span : 7);
  const all = items(); const g = { t: [], o: [], s: [], d: [] };
  for (const r of all) {
    if (!isOpen(r)) { if (r.st === "입고완료") g.d.push(r); continue; }
    if (r.D == null) continue;
    if (r.D === 0) g.t.push(r); else if (r.D < 0) g.o.push(r); else if (r.D <= span) g.s.push(r);
  }
  const k = (a, b) => (a.due > b.due ? 1 : a.due < b.due ? -1 : (a.code > b.code ? 1 : -1));
  g.t.sort(k); g.o.sort(k); g.s.sort(k); g.d.sort((a, b) => (a.act < b.act ? 1 : -1));
  return { g, all };
}
function dayTasks(ds) {
  const L = (S.memos[ds] || []).map((x) => ({ ln: x[0], t: x[1], s: !!x[2] }));
  for (const q of S.queue) {
    const o = q.op; if (o.date !== ds) continue;
    if (o.t === "add") for (const l of o.lines || []) L.push({ ln: 0, t: l, s: false, pq: q });
    if (o.t === "chk") {
      const c = L.filter((x) => x.t === o.text); if (!c.length) continue;
      c.sort((a, b) => Math.abs(a.ln - o.ln) - Math.abs(b.ln - o.ln));
      c[0].s = !!o.on; c[0].pq = q;
    }
  }
  return L;
}
function needUrge(over) {
  const s = S.meta.sent || {}; const codes = s.d === today() ? new Set(s.codes || []) : new Set();
  return over.filter((r) => !codes.has(r.code)).length;
}

// ---------- 공통 그리기 ----------
document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => go(b.dataset.v)));
function go(v, sub) {
  V.tab = v; V.sel.clear();
  if (v === "in") V.inTab = sub || V.inTab; if (v === "work" && sub) { V.day = sub; V.cy = 0; }
  render(); window.scrollTo(0, 0);
}
function render() {
  if (!user) return;
  const t = new Date(); $("#hdt").textContent = (t.getMonth() + 1) + "/" + t.getDate() + " (" + WK[t.getDay()] + ")";
  pcStatus();
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.v === V.tab));
  const ae = document.activeElement; const keep = ae && ae.id ? { id: ae.id, v: ae.value, s: ae.selectionStart } : null;
  let h = "";
  if (S.err) h += '<div class="card err" style="margin-bottom:10px">' + esc(S.err) + "</div>";
  if (!S.loaded.items && !S.err) h += '<div class="empty">PC 에서 올린 내용을 불러오는 중입니다...</div>';
  else if (V.tab === "home") h += homeView();
  else if (V.tab === "in") h += inView();
  else if (V.tab === "work") h += workView();
  else h += venView();
  $("#view").innerHTML = h;
  actBar();
  if (keep) { const e = document.getElementById(keep.id); if (e) { e.value = keep.v; e.focus(); try { e.setSelectionRange(keep.s, keep.s); } catch (x) {} } }
}
function pcStatus() {
  const m = S.meta || {}; let txt = "";
  if (!m.hb) txt = '<span class="dot" style="background:#8A96A3"></span>PC 에서 아직 올린 내용이 없습니다';
  else {
    const hb = new Date(m.hb.replace(" ", "T")); const on = m.on !== false && (Date.now() - hb.getTime()) < 7 * 60000;
    const hm = pad(hb.getHours()) + ":" + pad(hb.getMinutes());
    txt = on ? '<span class="dot" style="background:#3ED598"></span>PC 켜짐 · ' + hm + " 확인"
             : '<span class="dot" style="background:#8A96A3"></span>PC 꺼짐 · 마지막 동기화 ' + md2(m.hb.slice(0, 10)) + " " + hm;
  }
  if (S.queue.length) txt += ' · <b style="color:#FFC27A">PC 반영 대기 ' + S.queue.length + "건</b>";
  $("#pcst").innerHTML = txt;
}

// ---------- 홈 ----------
function homeView() {
  const { g } = groups(); const ts = today(); const tk = dayTasks(ts); const dn = tk.filter((x) => x.s).length;
  const up = g.t.length + g.s.length; const nu = needUrge(g.o);
  let h = '<div class="cards">';
  h += kpi("오늘 입고예정", g.t.length + "건", "go('in','t')", false);
  h += kpi("입고 임박", up + "건", "go('in','s')", false);
  h += kpi("지연", g.o.length + "건", "go('in','o')", g.o.length > 0);
  h += kpi("독촉 필요", nu + "건", "go('in','o')", nu > 0);
  h += kpi("오늘 업무", tk.length + "건 중 " + dn + "건 완료", "go('work','" + ts + "')", false, true);
  h += "</div>";
  if (g.o.length) {
    h += "<h3>지연 품목</h3><div class=\"list\">" + g.o.slice(0, 5).map(itemRow).join("") + "</div>";
    if (g.o.length > 5) h += '<div class="note" style="text-align:right" onclick="go(\'in\',\'o\')">지연 ' + g.o.length + "건 모두 보기 ›</div>";
  }
  if (tk.length) {
    h += "<h3>오늘 업무</h3><div class=\"list\">" + tk.map((x, i) => taskRow(ts, x, i)).join("") + "</div>";
  }
  const ap = (S.meta.applied || []).filter((x) => !x.ok).slice(0, 5);
  if (ap.length) {
    h += "<h3>PC 에서 반영하지 못한 요청</h3><div class=\"list\">" + ap.map((x) =>
      '<div class="it"><div class="bd"><div class="t1" style="color:var(--danger)">' + esc(x.msg) + '</div><div class="t2">' + esc(x.at) + "</div></div></div>").join("") + "</div>";
  }
  h += '<div class="note">PC 가 꺼져 있어도 마지막으로 받은 내용을 볼 수 있습니다. 날짜(D-day, 지연 일수)는 핸드폰이 오늘 기준으로 다시 계산합니다.<br>핸드폰에서 누른 입고완료 · 업무는 PC 가 켜져 있으면 10~20초 안에, 꺼져 있으면 다음에 켤 때 반영됩니다.</div>';
  h += '<button class="logout" onclick="logout()">로그아웃</button>';
  return h;
}
function kpi(l, n, on, bad, wide) {
  return '<div class="card kpi' + (bad ? " bad" : "") + (wide ? " wide" : "") + '" onclick="' + on + '"><div class="l">' + l + '</div><div class="n">' + n + "</div></div>";
}

// ---------- 입고 ----------
function badge(r) {
  if (r.pq) return '<span class="bdg p">반영 대기</span>';
  if (r.st === "입고완료") return '<span class="bdg d">완료 ' + md2(r.act) + "</span>";
  if (r.D == null) return '<span class="bdg">-</span>';
  if (r.D < 0) return '<span class="bdg o">+' + (-r.D) + "일</span>";
  if (r.D === 0) return '<span class="bdg t">오늘</span>';
  return '<span class="bdg">D-' + r.D + "</span>";
}
function itemRow(r, withChk) {
  const cb = withChk && isOpen(r) && !r.pq
    ? '<input type="checkbox" class="chk" ' + (V.sel.has(r.id) ? "checked" : "") + ' onclick="event.stopPropagation();selItem(' + r.id + ',this.checked)">'
    : (withChk ? '<span style="width:24px;flex:none"></span>' : "");
  const u = r.u ? " · 발송 " + r.u[0] + "회" : "";
  return '<div class="it" onclick="openItem(' + r.id + ')">' + cb + '<div class="bd"><div class="t1">' + esc(r.vendor || "(업체 없음)") + " · " + esc(r.code) +
    '</div><div class="t2">' + esc(r.name) + (r.qty ? " · " + esc(r.qty) : "") + " · " + md2(r.due) + u + "</div></div>" + badge(r) + "</div>";
}
function inView() {
  const { g, all } = groups();
  if (!V.inTab) V.inTab = g.t.length ? "t" : g.o.length ? "o" : g.s.length ? "s" : "t";
  const tabs = [["t", "오늘", g.t.length], ["o", "지연", g.o.length], ["s", "임박", g.s.length], ["d", "완료", g.d.length]];
  let h = '<input id="q" class="inp" placeholder="도번 · 품명 · 업체 검색" value="' + esc(V.q) + '" oninput="V.q=this.value;render()" style="margin-bottom:10px">';
  let rows;
  if (V.q.trim()) {
    const q = V.q.trim().toLowerCase();
    rows = all.filter((r) => r.st !== "취소" && [r.code, r.name, r.vendor, r.car].some((x) => String(x || "").toLowerCase().includes(q)));
    h += '<div class="note">검색 결과 ' + rows.length + "건 (미완료 + 최근 14일 입고완료)</div>";
  } else {
    h += '<div class="seg">' + tabs.map((x) => '<button class="' + (V.inTab === x[0] ? "on" : "") + '" onclick="V.inTab=\'' + x[0] + '\';V.sel.clear();render()">' + x[1] + " " + x[2] + "</button>").join("") + "</div>";
    rows = g[V.inTab];
  }
  if (!rows.length) return h + '<div class="list"><div class="empty">해당 품목이 없습니다.</div></div>';
  const can = rows.filter((r) => isOpen(r) && !r.pq);
  if (can.length > 1) {
    const allOn = can.every((r) => V.sel.has(r.id));
    h += '<div class="note" style="text-align:right"><span onclick="selAll(' + (allOn ? 0 : 1) + ')" style="color:var(--navy2);font-weight:700">' + (allOn ? "선택 해제" : "모두 선택") + "</span></div>";
  }
  h += '<div class="list">' + rows.map((r) => itemRow(r, true)).join("") + "</div>";
  h += '<div class="note">품목을 체크하고 아래 [입고완료] 를 누르면 실입고일이 오늘로 들어갑니다. 품목을 누르면 상세 내용과 업체 연락처가 나옵니다.</div>';
  window._rows = rows;
  return h;
}
window.selItem = (id, on) => { if (on) V.sel.add(id); else V.sel.delete(id); actBar(); };
window.selAll = (on) => { (window._rows || []).filter((r) => isOpen(r) && !r.pq).forEach((r) => (on ? V.sel.add(r.id) : V.sel.delete(r.id))); render(); };
function actBar() {
  const e = $("#act");
  if (V.tab === "in" && V.sel.size) {
    e.innerHTML = '<div class="actbar"><button class="btn gray" onclick="V.sel.clear();render()">취소</button><button class="btn red" onclick="doneSel()">선택 ' + V.sel.size + "건 입고완료</button></div>";
  } else e.innerHTML = "";
}
window.doneSel = () => {
  const its = items().filter((r) => V.sel.has(r.id) && isOpen(r) && !r.pq);
  if (!its.length) return;
  if (!confirm(its.length + "건을 입고완료로 처리할까요?\n실입고일 : " + md(today()))) return;
  its.forEach((r) => sendOp({ t: "done", sid: r.id, code: r.code, date: today() }));
  V.sel.clear(); toast(its.length + "건 입고완료 · PC 에 반영 중"); render();
};
window.openItem = (id) => {
  const r = items().find((x) => x.id === id); if (!r) return;
  const kv = (k, v) => '<div class="kv"><div class="k">' + k + '</div><div class="v">' + v + "</div></div>";
  let h = '<div class="sheet-bg" onclick="closeSheet(event)"><div class="sheet" onclick="event.stopPropagation()">';
  h += "<h2>" + esc(r.code) + " " + badge(r) + "</h2>";
  h += kv("품명", esc(r.name)) + kv("업체", esc(r.vendor)) + kv("차종", esc(r.car)) + kv("수량", esc(r.qty || "-"));
  h += kv("입고예정", md(r.due) + (r.D != null && isOpen(r) ? (r.D < 0 ? "  <b style='color:var(--danger)'>지연 +" + (-r.D) + "일</b>" : r.D === 0 ? "  <b>오늘</b>" : "  D-" + r.D) : ""));
  h += kv("상태", esc(r.st) + (r.act ? " (" + md(r.act) + ")" : ""));
  h += kv("발송횟수", r.u ? r.u[0] + "회 · " + md2(r.u[1]) : "-");
  if (r.memo) h += kv("비고", esc(r.memo));
  const v = (S.vendors || []).find((x) => x.n === r.vendor);
  if (v && v.c && v.c.length) h += kv("담당자", v.c.map((c) => esc(c.m) + (c.p ? ' <a href="tel:' + esc(c.p.replace(/[^0-9+]/g, "")) + '">' + esc(c.p) + "</a>" : "")).join("<br>"));
  h += '<div class="btns"><button class="btn gray" onclick="closeSheet()">닫기</button>';
  if (r.pq && r.pq.op.t === "done") h += '<button class="btn" onclick="cancelPend(\'' + r.pq.id + '\')">입고완료 취소 (반영 전)</button>';
  else if (r.pq) h += '<button class="btn gray" disabled>PC 반영 대기 중</button>';
  else if (isOpen(r)) h += '<button class="btn red" onclick="doneOne(' + r.id + ')">입고완료</button>';
  else if (r.st === "입고완료") h += '<button class="btn" onclick="undoOne(' + r.id + ')">입고완료 되돌리기</button>';
  h += "</div></div></div>";
  $("#sheet").innerHTML = h;
};
window.closeSheet = () => { $("#sheet").innerHTML = ""; };
window.doneOne = (id) => { const r = items().find((x) => x.id === id); if (!r) return; sendOp({ t: "done", sid: id, code: r.code, date: today() }); closeSheet(); toast(r.code + " 입고완료 · PC 에 반영 중"); };
window.undoOne = (id) => {
  const r = items().find((x) => x.id === id); if (!r) return;
  if (!confirm(r.code + " 입고완료를 되돌릴까요?")) return;
  const d = dday(r.due); sendOp({ t: "undo", sid: id, code: r.code, prev: d != null && d < 0 ? "지연" : "대기" }); closeSheet(); toast("되돌리기 · PC 에 반영 중");
};
window.cancelPend = (qid) => { cancelOp(qid); closeSheet(); toast("보내기 전 요청을 취소했습니다"); };

// ---------- 업무 (달력) ----------
function workView() {
  if (!V.cy) { const d = P(V.day); V.cy = d.getFullYear(); V.cm = d.getMonth(); }
  const y = V.cy, m = V.cm; const first = new Date(y, m, 1); const start = new Date(y, m, 1 - first.getDay());
  const holi = S.meta.holi || {}; const ts = today();
  let h = '<div class="cal"><div class="calh"><button onclick="mv(-1)">◀</button><b>' + y + "년 " + (m + 1) + '월</b><button onclick="mv(1)">▶</button></div><div class="grid">';
  for (let i = 0; i < 7; i++) h += '<div class="wk" style="' + (i === 0 ? "color:var(--danger)" : i === 6 ? "color:#1565C0" : "") + '">' + WK[i] + "</div>";
  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i); const ds = ymd(d);
    if (i >= 35 && d.getMonth() !== m) break;
    const tk = dayTasks(ds); const dn = tk.filter((x) => x.s).length;
    const cls = ["dc"]; if (d.getMonth() !== m) cls.push("out"); if (d.getDay() === 0) cls.push("sun"); if (d.getDay() === 6) cls.push("sat");
    if (holi[ds]) cls.push("hol"); if (ds === ts) cls.push("td"); if (ds === V.day) cls.push("sel");
    h += '<div class="' + cls.join(" ") + '" onclick="pick(\'' + ds + '\')">' + d.getDate() +
      (holi[ds] ? '<span class="hn">' + esc(holi[ds]) + "</span>" : "") + (tk.length ? '<span class="cnt">' + dn + "/" + tk.length + "</span>" : "") + "</div>";
  }
  h += "</div></div>";
  const L = dayTasks(V.day);
  h += "<h3>" + md(V.day) + (holi[V.day] ? ' <span style="color:var(--danger)">' + esc(holi[V.day]) + "</span>" : "") + " · 업무 " + L.length + "건</h3>";
  h += '<div class="list">' + (L.length ? L.map((x, i) => taskRow(V.day, x, i)).join("") : '<div class="empty">업무가 없습니다.</div>') + "</div>";
  h += '<div class="addrow"><input id="addt" class="inp" placeholder="업무 입력 (예: 업체 미팅)" onkeydown="if(event.key===\'Enter\')addTask()"><button class="btn" onclick="addTask()">추가</button></div>';
  const rg = S.meta.range || [];
  if (rg.length === 2 && (V.day < rg[0] || V.day > rg[1])) h += '<div class="note">이 날짜는 PC 에서 받은 범위(' + md2(rg[0]) + " ~ " + md2(rg[1]) + ") 밖이라 기존 업무가 보이지 않을 수 있습니다. 추가는 됩니다.</div>";
  h += '<div class="note">업무를 누르면 체크(취소선) / 다시 누르면 해제됩니다. PC 달력 메모에 그대로 들어갑니다.</div>';
  return h;
}
function taskRow(ds, x, i) {
  return '<div class="task' + (x.s ? " s" : "") + '" onclick="tgl(\'' + ds + "'," + i + ')"><input type="checkbox" class="chk" ' + (x.s ? "checked" : "") +
    ' style="pointer-events:none"><div class="tx">' + esc(x.t) + "</div>" + (x.pq ? '<span class="bdg p">반영 대기</span>' : "") + "</div>";
}
window.mv = (k) => { V.cm += k; if (V.cm < 0) { V.cm = 11; V.cy--; } if (V.cm > 11) { V.cm = 0; V.cy++; } render(); };
window.pick = (ds) => { V.day = ds; render(); };
window.tgl = (ds, i) => { const x = dayTasks(ds)[i]; if (!x) return; sendOp({ t: "chk", date: ds, ln: x.ln, text: x.t, on: !x.s }); };
window.addTask = () => {
  const e = $("#addt"); const t = (e.value || "").trim(); if (!t) return;
  sendOp({ t: "add", date: V.day, lines: t.split(/\n+/).map((s) => s.trim()).filter(Boolean) });
  e.value = ""; toast(md(V.day) + " 업무 추가 · PC 에 반영 중");
};

// ---------- 업체 연락처 ----------
function venView() {
  const q = V.vq.trim().toLowerCase();
  const L = (S.vendors || []).filter((v) => !q || v.n.toLowerCase().includes(q) || (v.c || []).some((c) => String(c.m).toLowerCase().includes(q)));
  let h = '<input id="vq" class="inp" placeholder="업체명 · 담당자 검색" value="' + esc(V.vq) + '" oninput="V.vq=this.value;render()" style="margin-bottom:10px">';
  if (!L.length) return h + '<div class="list"><div class="empty">업체가 없습니다.</div></div>';
  h += L.map((v) => '<div class="card ven" style="margin-bottom:8px"><div class="vn">' + esc(v.n) + "</div>" +
    ((v.c || []).length ? v.c.map((c) => '<div class="ct"><span>' + esc(c.m || "담당자") + (c.main ? ' <span class="bdg">기본</span>' : "") + "<br><span style=\"color:var(--sub);font-size:13px\">" + esc(c.p || "전화번호 없음") + "</span></span>" +
      (c.p ? '<a href="tel:' + esc(c.p.replace(/[^0-9+]/g, "")) + '">전화</a>' : "") + "</div>").join("") : '<div class="note">등록된 담당자가 없습니다.</div>') + "</div>").join("");
  return h;
}

// ---------- 로그인 / 처음 설정 ----------
function loginView() {
  $("#hdr").hidden = true; $("#tabs").hidden = true; $("#act").innerHTML = "";
  $("#view").innerHTML = '<div class="login"><div class="card"><h2 style="margin:0 0 4px">입고톡</h2><div class="note">PC 입고톡과 같은 Firebase 계정으로 로그인해 주세요. 한 번 로그인하면 다음부터는 바로 열립니다.</div>' +
    '<label>이메일</label><input id="em" class="inp" type="email" autocomplete="username">' +
    '<label>비밀번호</label><input id="pw" class="inp" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')login()">' +
    '<button class="btn full" style="margin-top:16px" onclick="login()">로그인</button><div id="lerr" class="err"></div></div></div>';
}
window.login = () => {
  const em = $("#em").value.trim(), pw = $("#pw").value;
  if (!em || !pw) { $("#lerr").textContent = "이메일과 비밀번호를 넣어 주세요."; return; }
  $("#lerr").textContent = "로그인 중...";
  signInWithEmailAndPassword(auth, em, pw).catch((e) => {
    const c = e.code || "";
    $("#lerr").textContent = c.includes("invalid") || c.includes("wrong") || c.includes("not-found") ? "이메일 또는 비밀번호가 맞지 않습니다."
      : c.includes("network") ? "인터넷 연결을 확인해 주세요." : c.includes("too-many") ? "시도가 너무 많습니다. 잠시 후 다시 해 주세요." : "로그인 실패 : " + c;
  });
};
window.logout = () => { if (confirm("로그아웃할까요?\n다시 쓰려면 이메일 · 비밀번호를 넣어야 합니다.")) signOut(auth); };
function setupView() {
  $("#view").innerHTML = '<div class="login"><div class="card"><h2 style="margin:0 0 4px">입고톡 처음 설정</h2><div class="note">PC 입고톡 [설정] - [모바일 앱 연동] 의 [모바일 앱 파일 만들기] 로 만든 파일을 올리면 이 화면은 나오지 않습니다.</div>' +
    '<label>API 키 (apiKey)</label><input id="ak" class="inp"><label>프로젝트 ID (projectId)</label><input id="pj" class="inp">' +
    '<button class="btn full" style="margin-top:16px" onclick="saveCfg()">저장</button></div></div>';
}
window.saveCfg = () => { const a = $("#ak").value.trim(), p = $("#pj").value.trim(); if (!a || !p) return; localStorage.setItem("ipgo_cfg", JSON.stringify({ apiKey: a, projectId: p })); location.reload(); };
window.go = go; window.render = render; window.V = V;
setInterval(() => { if (user) pcStatus(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && user) render(); });
</script>
</body>
</html>
